name: Update YouTube videos

"on":
  schedule:
    # every 24 hours, don't need to touch this
    - cron: '0 0 * * *'
  workflow_dispatch: {}   # so I can hit "run workflow" manually when I want

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: grab latest videos from my rss feed
        run: python3 scripts/fetch_videos.py

      - name: commit the updated json if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          if git diff --staged --quiet; then
            echo "nothing new, skipping commit"
          else
            git commit -m "update latest youtube videos"
            git push
          fi
