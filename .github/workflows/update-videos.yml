name: Update YouTube videos

"on":
  schedule:
    # Every 24 hours. GitHub may delay scheduled runs by a few minutes under load.
    - cron: '0 0 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch latest videos from RSS
        run: python3 scripts/fetch_videos.py

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update latest YouTube videos"
            git push
          fi
